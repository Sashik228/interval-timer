<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0b">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Таймер">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Таймер</title>
<link rel="preload" href="font-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="font-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* VOICE quiet luxury, strict; a precision instrument, not a fitness poster
   IDEA a watch dial and its strap card: deep lacquer colours, thin numerals, hairline rules
   PICTURE the countdown in very thin numerals on a deep phase colour; timers as lacquered tiles with a hairline rhythm
   COLOUR rich black ground, warm white ink; vermilion work, cobalt rest, antique gold prep, midnight long rest
   TYPE Inter Tight 200 for numbers, 300 for titles, 500 for small labels
   LAYOUT one column up to 560px, square corners, hairlines only, generous margins; run view full screen */
@font-face{font-family:'Inter Tight';font-style:normal;font-weight:100 900;font-display:swap;src:url(font-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Inter Tight';font-style:normal;font-weight:100 900;font-display:swap;src:url(font-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{color-scheme:dark;--bg:#0c0c0b;--ink:#f1efea;--mute:#8b8880;--dim:#5f5d58;--hair:rgba(241,239,234,.12);--warn:#e0644a;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0;margin:0;border-radius:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 'Inter Tight',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit;background:none;border:0;padding:0;border-radius:0}
button,a{cursor:pointer;color:inherit;text-decoration:none}
:focus-visible{outline:1px solid currentColor;outline-offset:3px}
.view{display:none;max-width:560px;margin:0 auto;padding:calc(12px + var(--st)) 24px calc(48px + var(--sb))}
.view.on{display:block}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:68px;margin-bottom:16px}
.seg{display:flex;gap:20px}
.seg a{font-size:clamp(26px,7.6vw,32px);font-weight:300;letter-spacing:-.03em;color:var(--dim);transition:color .3s}
.seg a[aria-current=page]{color:var(--ink)}
.lk{display:inline-flex;align-items:center;min-height:44px;font-size:13px;font-weight:500;letter-spacing:.01em;color:var(--mute);white-space:nowrap;transition:color .2s}
.lk:hover,.lk.on{color:var(--ink)}
.ul{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px;text-decoration-color:var(--dim)}
.warn{color:var(--warn)}
.next{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--hair);font-size:13px;margin-bottom:12px}
.next span{color:var(--mute)}
.next b{font-weight:500;text-align:right}
.tiles{display:grid;gap:10px}
.tile{display:flex;flex-direction:column;position:relative;padding:22px 22px 20px;background:var(--c);color:var(--ci)}
.tn{font-size:15px;font-weight:500;padding-right:70px;overflow-wrap:anywhere}
.te{position:absolute;top:22px;right:22px;font-size:13px;font-weight:500;opacity:.75}
.tt{font-size:76px;font-weight:200;letter-spacing:-.05em;line-height:.95;margin:22px 0 8px -.04em;font-variant-numeric:tabular-nums}
.ts{font-size:13px;opacity:.72}
.strip{display:flex;align-items:flex-end;gap:2px;height:10px;margin-top:20px}
.strip i{flex-basis:0;min-width:1px;height:100%;background:currentColor;opacity:.92}
.strip .prep{opacity:.45}
.strip .rest{height:2px;opacity:.5}
.strip .long{height:2px;opacity:.22}
.add{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:64px;border-bottom:1px solid var(--hair);font-size:15px;color:var(--mute);text-align:left;transition:color .2s}
.add:hover{color:var(--ink)}
.plus{font-size:28px;font-weight:200;line-height:1}
.prow{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:108px;border-bottom:1px solid var(--hair)}
.hd+.prow,.add.first{border-top:1px solid var(--hair)}
.pmain{display:flex;flex-direction:column;align-items:flex-start;text-align:left;flex:1;padding:16px 0}
.pt{font-size:52px;font-weight:200;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.pd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin-top:10px}
.dot{width:8px;height:8px;background:var(--c);flex:none}
.foot{font-size:12px;color:var(--dim);margin-top:18px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:64px;border-bottom:1px solid var(--hair)}
#sf .frow:first-child{border-top:1px solid var(--hair)}
.frow label{font-size:16px;flex:1 1 auto}
.frow select,.frow input[type=time]{appearance:none;-webkit-appearance:none;text-align:right;text-align-last:right;font-size:20px;font-weight:300;min-height:44px;max-width:62%;color:var(--ink)}
.frow select option{background:#1a1a19;color:var(--ink)}
.frow input[type=time]::-webkit-calendar-picker-indicator{opacity:.35;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:28px 0}
.days button{aspect-ratio:1;border:1px solid var(--hair);font-size:13px;font-weight:500;color:var(--mute);transition:background-color .2s,color .2s,border-color .2s}
.days button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.days.need button{border-color:var(--warn)}
.cta{width:100%;height:56px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600;letter-spacing:.01em}
.fbtns{display:flex;justify-content:space-between;margin-top:10px}
.etop{background:var(--c);color:var(--ci);margin:calc(-12px - var(--st)) -24px 0;padding:var(--st) 24px 26px;transition:background-color .4s}
.ehd{display:flex;justify-content:space-between;align-items:center;min-height:60px}
.ehd .lk{color:inherit;opacity:.75}
.ehd #e_save{opacity:1;font-weight:600}
.ename{display:block;width:100%;font-size:28px;font-weight:300;letter-spacing:-.02em;padding:6px 0;margin-top:10px;border-bottom:1px solid transparent}
.ename::placeholder{color:inherit;opacity:.5}
.ename:focus-visible{outline:0;border-bottom-color:currentColor}
.etot{font-size:76px;font-weight:200;letter-spacing:-.05em;line-height:.95;margin:18px 0 8px -.04em;font-variant-numeric:tabular-nums}
.esum{font-size:13px;opacity:.72}
.sws{display:flex;gap:4px;margin:20px 0 4px -8px}
.swb{width:44px;height:44px;display:grid;place-items:center}
.swb::before{content:"";width:26px;height:26px;background:var(--c);outline:1px solid transparent;outline-offset:4px;transition:outline-color .2s}
.swb[aria-pressed=true]::before{outline-color:var(--ink)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;min-height:60px;padding-bottom:10px;border-bottom:1px solid var(--hair);font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--mute)}
.sh .lk{min-height:0;font-size:12px}
.st{display:flex;align-items:center;flex:none;margin-right:-12px}
.st button{width:44px;height:44px;display:grid;place-items:center;color:var(--mute);transition:color .2s}
.st button:hover{color:var(--ink)}
.st svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.2;fill:none}
.sv{display:flex;align-items:baseline;justify-content:center;min-width:4.4em}
.sv input{width:3.1ch;text-align:right;font-size:28px;font-weight:200;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.u{font-size:12px;color:var(--mute);margin-left:3px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:24px;border:1px solid var(--dim);position:relative;flex:none;cursor:pointer;transition:background-color .2s,border-color .2s}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--mute);transition:transform .2s,background-color .2s}
.sw:checked{background:var(--ink);border-color:var(--ink)}
.sw:checked::before{transform:translateX(20px);background:var(--bg)}
.del{display:flex;margin-top:28px}
.run{position:fixed;inset:0;max-width:none;margin:0;padding:0;--f:#94672a;--fi:#fbf8f3;background:var(--f);color:var(--fi);flex-direction:column;z-index:10;overflow-y:auto;transition:background-color .6s cubic-bezier(.2,.7,.2,1)}
.run.on{display:flex}
.run[data-p=work]{--f:#c9431e}
.run[data-p=rest]{--f:#24418f}
.run[data-p=long]{--f:#141c38}
.run[data-p=done]{--f:#0c0c0b}
.rtop{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:center;height:56px;margin:var(--st) 10px 0;flex:none}
.ib{width:56px;height:56px;display:grid;place-items:center;opacity:.85}
.ib svg{width:20px;height:20px}
.rname{text-align:center;font-size:13px;font-weight:500;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmid{flex:1;width:100%;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding:20px 28px}
.ph{font-size:15px;font-weight:500;opacity:.82}
.dg{font-size:clamp(170px,min(62vw,48vh),460px);font-weight:200;line-height:.84;letter-spacing:-.06em;margin:16px 0 22px -.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
.dg.sm{font-size:clamp(92px,min(28vw,26vh),240px)}
.meta{font-size:15px;opacity:.72;min-height:1.45em}
.rbot{width:100%;max-width:1040px;margin:0 auto;padding:0 28px calc(24px + var(--sb));flex:none}
.line{display:flex;align-items:flex-end;gap:2px;height:8px}
.line div{flex-basis:0;min-width:2px;height:1px;position:relative;overflow:hidden;background:color-mix(in srgb,currentColor 30%,transparent)}
.line div.w{height:4px}
.line i{position:absolute;inset:0 auto 0 0;width:0;background:currentColor}
.rinfo{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.01em;opacity:.72;margin:12px 0 28px;font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:space-between;align-items:center}
.ctl .ib{margin:0 -16px}
.ctl .ib svg{width:18px;height:18px;fill:currentColor}
.go{width:80px;height:80px;background:var(--fi);color:var(--f);display:grid;place-items:center;transition:color .6s cubic-bezier(.2,.7,.2,1)}
.go svg{width:22px;height:22px;fill:currentColor}
.ln{fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:square}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + var(--sb));max-width:528px;margin:0 auto;display:none;justify-content:space-between;align-items:center;gap:14px;padding:16px 18px;background:#1a1a19;color:var(--ink);font-size:14px;z-index:30}
.toast.on{display:flex}
.toast a{font-weight:600;text-decoration:underline;text-underline-offset:4px}
@media(prefers-reduced-motion:reduce){.run,.go,.etop,.sw,.sw::before,.seg a{transition:none}}
</style>
</head>
<body>
<section class="view" id="v-home"></section>
<section class="view" id="v-plan"></section>
<section class="view" id="v-edit"></section>
<section class="view run" id="v-run" data-p="prep">
  <div class="rtop">
    <button class="ib" id="rx" aria-label="Закрити"><svg viewBox="0 0 24 24"><path class="ln" d="M6 6l12 12M18 6 6 18"/></svg></button>
    <span class="rname" id="rname"></span>
    <button class="ib" id="snd" aria-label="Звук" aria-pressed="true"><svg viewBox="0 0 24 24"><path class="ln" d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="ln" id="sndw" d=""/></svg></button>
  </div>
  <div class="rmid">
    <p class="ph" id="phase" aria-live="polite"></p>
    <div class="dg" id="dig"></div>
    <p class="meta" id="meta"></p>
  </div>
  <div class="rbot">
    <div class="line" id="line" aria-hidden="true"></div>
    <div class="rinfo"><span id="el">0:00</span><span id="left">0:00</span></div>
    <div class="ctl">
      <button class="ib" id="back" aria-label="Попередній інтервал"><svg viewBox="0 0 24 24"><path d="M6 6h1.4v12H6zM18 6v12l-9-6z"/></svg></button>
      <button class="go" id="go" aria-label="Старт"><svg viewBox="0 0 24 24"><path id="gop" d=""/></svg></button>
      <button class="ib" id="skip" aria-label="Наступний інтервал"><svg viewBox="0 0 24 24"><path d="M16.6 6H18v12h-1.4zM6 6v12l9-6z"/></svg></button>
    </div>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
{
const $=id=>document.getElementById(id);
const H=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pl=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:(m>=2&&m<=4&&(h<10||h>=20)?b:c)};
const p2=n=>String(n).padStart(2,'0');
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}:${p2(m)}:${p2(s%60)}`:`${m}:${p2(s%60)}`};
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const COLORS=['#c9431e','#24418f','#94672a','#2f5d50','#6b2a3a','#2a2a28'];
const lin=v=>(v/=255)<=.04045?v/12.92:((v+.055)/1.055)**2.4;
const okCol=c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:COLORS[0];
const inkOn=c=>{const n=parseInt(okCol(c).slice(1),16);const L=.2126*lin(n>>16)+.7152*lin(n>>8&255)+.0722*lin(n&255);return L>.3?'#111111':'#fbf8f3'};
const ORDER=[1,2,3,4,5,6,0],DN=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'],BYDAY=['SU','MO','TU','WE','TH','FR','SA'],REM=[0,5,10,15,30,60];
const NAME={prep:'Приготуйся',work:'Робота',rest:'Перерва',long:'Відпочинок'};
const PHC={prep:'#94672a',work:'#c9431e',rest:'#24418f',long:'#141c38',done:'#0c0c0b'};
const LIM={prep:[0,600],rounds:[1,30],reps:[1,50],work:[1,3600],rest:[0,600],after:[0,3600]};
const SEED=[{id:'mine',name:'Моє тренування',color:'#c9431e',prep:5,rounds:3,skipLast:true,blocks:[{reps:3,work:30,rest:5,after:30},{reps:3,work:30,rest:5,after:60}]}];
const KEY='interval-timer.v3';
let db;
try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){db=null}
if(!db||!Array.isArray(db.timers))db={timers:clone(SEED),schedules:[],fired:[]};
for(const k of ['schedules','fired'])if(!Array.isArray(db[k]))db[k]=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
save();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
const getT=id=>db.timers.find(t=>t.id===id);
const cv=T=>{const c=okCol(T.color);return `--c:${c};--ci:${inkOn(c)}`};
const isApple=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
const BG=()=>'#0c0c0b';
const metas=[...document.querySelectorAll('meta[name=theme-color]')];
const theme=c=>metas.forEach(m=>{m.content=c});

/* structure */
function build(T){
  const segs=[];let t=0;const nb=T.blocks.length;
  const add=(p,d,o)=>{d=+d||0;if(d>0){segs.push({p,d,s:t,...o});t+=d}};
  add('prep',T.prep,{c:1,b:1,k:0,n:0});
  for(let c=1;c<=T.rounds;c++)T.blocks.forEach((B,bi)=>{
    for(let k=1;k<=B.reps;k++){
      add('work',B.work,{c,b:bi+1,k,n:B.reps});
      const end=k===B.reps;
      if(end&&T.skipLast&&c===T.rounds&&bi===nb-1)continue;
      if(end)add('long',B.after,{c,b:bi+1,k,n:B.reps});else add('rest',B.rest,{c,b:bi+1,k,n:B.reps});
    }
  });
  return {segs,total:t};
}
function summary(T){
  const reps=T.blocks.reduce((a,b)=>a+b.reps,0)*T.rounds,ws=[...new Set(T.blocks.map(b=>b.work))],out=[];
  if(T.rounds>1)out.push(`${T.rounds} ${pl(T.rounds,'коло','кола','кіл')}`);
  out.push(ws.length===1?`${reps} × ${ws[0]} с`:`${reps} ${pl(reps,'підхід','підходи','підходів')}`);
  return out.join(' · ');
}
const stripHTML=segs=>segs.map(g=>`<i class="${g.p}" style="flex-grow:${g.d}"></i>`).join('');

/* dates */
const day0=d=>{d=new Date(d);return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
function nextOcc(s,after){
  const a=new Date(after),[h,m]=s.time.split(':').map(Number);
  for(let i=0;i<8;i++){const c=new Date(a.getFullYear(),a.getMonth(),a.getDate()+i,h,m,0,0);if(s.days.includes(c.getDay())&&c>a)return c}
  return null;
}
const WD=new Intl.DateTimeFormat('uk',{weekday:'long'});
function whenShort(at){
  const dd=Math.round((day0(at)-day0(Date.now()))/864e5);
  return `${dd===0?'сьогодні':dd===1?'завтра':WD.format(at)}, ${p2(at.getHours())}:${p2(at.getMinutes())}`;
}
function daysText(ds){
  const s=ORDER.filter(d=>ds.includes(d));
  if(s.length===7)return 'Щодня';
  if(s.join()==='1,2,3,4,5')return 'Пн–Пт';
  return s.map(d=>DN[d]).join(' ');
}
function nextAll(){
  let best=null;const now=new Date();
  for(const s of db.schedules){const T=getT(s.t),at=T&&nextOcc(s,now);if(at&&(!best||at<best.at))best={T,at}}
  return best;
}

/* toast */
let tt=0;
function toast(msg,href){
  const t=$('toast');
  t.innerHTML=`<span>${H(msg)}</span>`+(href?`<a href="${href}">Почати</a>`:'');
  t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),15000);
}
$('toast').addEventListener('click',()=>$('toast').classList.remove('on'));

const hdr=(v,right)=>`<header class="hd"><nav class="seg" aria-label="Розділи"><a href="#"${v==='home'?' aria-current="page"':''}>Таймери</a><a href="#plan"${v==='plan'?' aria-current="page"':''}>Розклад</a></nav>${right||''}</header>`;
const PLUS='<span class="plus" aria-hidden="true">+</span>';

/* home */
let editMode=false;
function renderHome(){
  const nx=editMode?null:nextAll();
  $('v-home').innerHTML=hdr('home',db.timers.length?`<button class="lk${editMode?' on':''}" id="hEdit">${editMode?'Готово':'Змінити'}</button>`:'')
    +(nx?`<a class="next" href="#run-${nx.T.id}"><span>Наступне</span><b>${whenShort(nx.at)} · ${H(nx.T.name)}</b></a>`:'')
    +'<div class="tiles">'
    +db.timers.map(T=>{const {segs,total}=build(T);return `<a class="tile" style="${cv(T)}" href="#${editMode?'edit':'run'}-${T.id}"><span class="tn">${H(T.name)}</span>${editMode?'<span class="te">Змінити</span>':''}<span class="tt">${fmt(total)}</span><span class="ts">${H(summary(T))}</span><span class="strip" aria-hidden="true">${stripHTML(segs)}</span></a>`}).join('')
    +`<a class="add" href="#new"><span>Новий таймер</span>${PLUS}</a></div>`;
}
$('v-home').addEventListener('click',e=>{if(e.target.id==='hEdit'){editMode=!editMode;renderHome()}});

/* editor */
let draft=null,editId=null;
const MINUS='<svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>',PLUSI='<svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg>';
function stepRow(k,label,v,step,unit){
  const id='e_'+k.replace(/\./g,'_');
  return `<div class="frow"><label for="${id}">${label}</label><div class="st"><button type="button" data-k="${k}" data-d="-${step}" aria-label="Менше">${MINUS}</button><span class="sv"><input id="${id}" type="number" inputmode="numeric" data-k="${k}" value="${v}">${unit?`<span class="u">${unit}</span>`:''}</span><button type="button" data-k="${k}" data-d="${step}" aria-label="Більше">${PLUSI}</button></div></div>`;
}
function blocksHTML(){
  return draft.blocks.map((b,i)=>`<div class="sh"><span>Блок ${i+1}</span>${draft.blocks.length>1?`<button type="button" class="lk" data-rm="${i}">Прибрати</button>`:''}</div>`
    +stepRow(`b.${i}.reps`,'Підходи',b.reps,1,'')+stepRow(`b.${i}.work`,'Робота',b.work,5,'с')+stepRow(`b.${i}.rest`,'Перерва',b.rest,5,'с')+stepRow(`b.${i}.after`,'Відпочинок після блоку',b.after,5,'с')).join('');
}
function openEditor(id){
  const T=id?getT(id):null;
  editId=T?id:null;
  draft=T?clone(T):{id:uid(),name:'',color:COLORS[db.timers.length%COLORS.length],prep:10,rounds:3,skipLast:true,blocks:[{reps:4,work:40,rest:20,after:60}]};
  draft.color=okCol(draft.color);
  $('v-edit').innerHTML=`<div class="etop" id="etop" style="${cv(draft)}">
      <header class="ehd"><a class="lk" href="#">Скасувати</a><button type="button" class="lk" id="e_save">Зберегти</button></header>
      <input class="ename" id="e_name" maxlength="40" value="${H(draft.name)}" placeholder="Назва" aria-label="Назва таймера">
      <div class="etot" id="e_tot"></div><div class="esum" id="e_sum"></div>
      <div class="strip" id="e_strip" aria-hidden="true"></div>
    </div>
    <div class="sws" role="group" aria-label="Колір">${COLORS.map(x=>`<button type="button" class="swb" style="--c:${x};--ci:${inkOn(x)}" data-col="${x}" aria-label="Колір ${x}" aria-pressed="${x===draft.color}"></button>`).join('')}</div>
    <div class="sh"><span>Загальне</span></div>
    ${stepRow('prep','Підготовка',draft.prep,5,'с')}${stepRow('rounds','Кола',draft.rounds,1,'')}
    <div id="e_blocks">${blocksHTML()}</div>
    <button type="button" class="add" id="e_add"><span>Додати блок</span>${PLUS}</button>
    <div class="frow"><label for="e_tail">Відпочинок у кінці</label><input type="checkbox" role="switch" class="sw" id="e_tail"${draft.skipLast?'':' checked'}></div>
    ${editId?'<button type="button" class="lk warn del" id="e_del">Видалити таймер</button>':''}`;
  preview();
}
function preview(){
  const {segs,total}=build(draft);
  $('e_tot').textContent=fmt(total);$('e_sum').textContent=summary(draft);$('e_strip').innerHTML=stripHTML(segs);
}
const getK=k=>{const p=k.split('.');return p[0]==='b'?draft.blocks[+p[1]][p[2]]:draft[k]};
function setK(k,v,write){
  const [a,b]=LIM[k.split('.').pop()];v=Math.min(b,Math.max(a,Math.round(v)));
  const p=k.split('.');if(p[0]==='b')draft.blocks[+p[1]][p[2]]=v;else draft[k]=v;
  if(write)$('e_'+k.replace(/\./g,'_')).value=v;
  preview();
}
const ve=$('v-edit');
ve.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.d){setK(t.dataset.k,getK(t.dataset.k)+Number(t.dataset.d),true);return}
  if(t.dataset.col){
    draft.color=t.dataset.col;const et=$('etop');et.style.setProperty('--c',draft.color);et.style.setProperty('--ci',inkOn(draft.color));
    document.querySelectorAll('.swb').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.col===draft.color)));
    theme(draft.color);return;
  }
  if(t.dataset.rm){draft.blocks.splice(+t.dataset.rm,1);$('e_blocks').innerHTML=blocksHTML();preview();return}
  if(t.id==='e_add'&&draft.blocks.length<10){draft.blocks.push(clone(draft.blocks[draft.blocks.length-1]));$('e_blocks').innerHTML=blocksHTML();preview();return}
  if(t.id==='e_save'){
    draft.name=$('e_name').value.trim()||'Таймер';
    const i=db.timers.findIndex(x=>x.id===draft.id);
    if(i>=0)db.timers[i]=draft;else db.timers.push(draft);
    save();editMode=false;location.hash='';return;
  }
  if(t.id==='e_del'){
    if(!t.dataset.arm){t.dataset.arm='1';t.textContent='Натисни ще раз, щоб видалити';return}
    db.timers=db.timers.filter(x=>x.id!==editId);db.schedules=db.schedules.filter(s=>s.t!==editId);
    save();if(!db.timers.length)editMode=false;location.hash='';
  }
});
ve.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='e_name'){draft.name=t.value;return}
  if(t.id==='e_tail'){draft.skipLast=!t.checked;preview();return}
  if(t.dataset.k&&t.value!==''&&Number.isFinite(+t.value))setK(t.dataset.k,+t.value,false);
});
ve.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='e_tail'){draft.skipLast=!t.checked;preview();return}
  if(t.dataset.k)setK(t.dataset.k,t.value===''||!Number.isFinite(+t.value)?getK(t.dataset.k):+t.value,true);
});

/* plan */
let sEdit=null;
function renderPlan(){
  const v=$('v-plan');
  if(sEdit){
    v.innerHTML=hdr('plan')+`<form id="sf">
      <div class="frow"><label for="s_t">Таймер</label><select id="s_t">${db.timers.map(T=>`<option value="${T.id}"${T.id===sEdit.t?' selected':''}>${H(T.name)}</option>`).join('')}</select></div>
      <div class="frow"><label for="s_time">Час</label><input type="time" id="s_time" value="${sEdit.time}" required></div>
      <div class="frow"><label for="s_rem">Нагадати</label><select id="s_rem">${REM.map(m=>`<option value="${m}"${m===sEdit.rem?' selected':''}>${m?`за ${m} хв`:'на початку'}</option>`).join('')}</select></div>
      <div class="days" id="s_days" role="group" aria-label="Дні тижня">${ORDER.map(d=>`<button type="button" data-day="${d}" aria-pressed="${sEdit.days.includes(d)}">${DN[d]}</button>`).join('')}</div>
      <button class="cta" type="submit">Зберегти</button>
      <div class="fbtns"><button type="button" class="lk" id="s_cancel">Скасувати</button>${sEdit.id?'<button type="button" class="lk warn" id="s_del">Видалити</button>':''}</div>
    </form>`;
    return;
  }
  const list=db.schedules.filter(s=>getT(s.t)).slice().sort((a,b)=>a.time.localeCompare(b.time));
  v.innerHTML=hdr('plan')
    +list.map(s=>{const T=getT(s.t);return `<div class="prow"><button class="pmain" style="${cv(T)}" data-sed="${s.id}"><span class="pt">${s.time}</span><span class="pd"><i class="dot"></i>${daysText(s.days)} · ${H(T.name)}</span></button>${isApple?`<button class="lk ul" data-ics="${s.id}">В календар</button>`:`<a class="lk ul" href="${H(gcal(s))}" target="_blank" rel="noopener">В календар</a>`}</div>`}).join('')
    +(db.timers.length?`<button class="add${list.length?'':' first'}" id="newS"><span>Запланувати</span>${PLUS}</button>`:'')
    +(list.length?'<p class="foot">Нагадування надходять з календаря телефона.</p>':'');
}
const vp=$('v-plan');
vp.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='newS'){sEdit={t:db.timers[0].id,days:[1,3,5],time:'08:00',rem:10};renderPlan();return}
  if(t.dataset.day){const d=+t.dataset.day,i=sEdit.days.indexOf(d);if(i>=0)sEdit.days.splice(i,1);else sEdit.days.push(d);t.setAttribute('aria-pressed',String(i<0));$('s_days').classList.remove('need');return}
  if(t.id==='s_cancel'){sEdit=null;renderPlan();return}
  if(t.id==='s_del'){
    if(!t.dataset.arm){t.dataset.arm='1';t.textContent='Ще раз, щоб видалити';return}
    db.schedules=db.schedules.filter(s=>s.id!==sEdit.id);save();sEdit=null;renderPlan();return;
  }
  if(t.dataset.sed){sEdit=clone(db.schedules.find(s=>s.id===t.dataset.sed));renderPlan();return}
  if(t.dataset.ics){const s=db.schedules.find(x=>x.id===t.dataset.ics);if(s)download(`trenuvannia-${s.id}.ics`,ics(s))}
});
vp.addEventListener('submit',e=>{
  e.preventDefault();
  if(!sEdit.days.length){$('s_days').classList.add('need');return}
  sEdit.t=$('s_t').value;sEdit.time=$('s_time').value||'08:00';sEdit.rem=+$('s_rem').value;
  sEdit.days=ORDER.filter(d=>sEdit.days.includes(d));
  if(sEdit.id){const i=db.schedules.findIndex(s=>s.id===sEdit.id);db.schedules[i]=sEdit}else{sEdit.id=uid();db.schedules.push(sEdit)}
  save();sEdit=null;renderPlan();
});

/* calendar */
const appUrl=()=>location.origin+location.pathname;
const dt=d=>`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}T${p2(d.getHours())}${p2(d.getMinutes())}00`;
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
const enc=new TextEncoder();
function fold(line){let out='',cur='',n=0;for(const ch of line){const b=enc.encode(ch).length;if(n+b>73){out+=cur+'\r\n ';cur='';n=1}cur+=ch;n+=b}return out+cur}
function calInfo(s){
  const T=getT(s.t),total=build(T).total,url=appUrl()+'#run-'+T.id;
  return {T,start:nextOcc(s,new Date(Date.now()-6e4)),mins:Math.max(1,Math.ceil(total/60)),url,rule:'FREQ=WEEKLY;BYDAY='+s.days.map(d=>BYDAY[d]).join(','),desc:`${summary(T)} · ${fmt(total)}\n${url}`};
}
function ics(s){
  const c=calInfo(s),stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Interval Timer//UK','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    `UID:${s.id}@interval-timer`,`DTSTAMP:${stamp}`,`DTSTART:${dt(c.start)}`,`DURATION:PT${c.mins}M`,`RRULE:${c.rule}`,
    'SUMMARY:'+icsEsc(c.T.name),'DESCRIPTION:'+icsEsc(c.desc),'URL:'+c.url,
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(c.T.name),'TRIGGER:'+(s.rem?`-PT${s.rem}M`:'PT0M'),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'].map(fold).join('\r\n')+'\r\n';
}
function gcal(s){
  const c=calInfo(s),end=new Date(c.start.getTime()+c.mins*6e4);
  const q=new URLSearchParams({action:'TEMPLATE',text:c.T.name,dates:dt(c.start)+'/'+dt(end),details:c.desc,recur:'RRULE:'+c.rule});
  try{const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;if(tz)q.set('ctz',tz)}catch(e){}
  return 'https://calendar.google.com/calendar/render?'+q.toString();
}
function download(name,text){
  const u=URL.createObjectURL(new Blob([text],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2e4);
}

/* reminder while open */
function due(){
  const now=Date.now();
  for(const s of db.schedules){
    const T=getT(s.t);if(!T)continue;
    const rm=s.rem*6e4,occ=nextOcc(s,new Date(now-12e4+rm));
    if(!occ||occ.getTime()-rm>now)continue;
    const key=s.id+'@'+occ.getTime();
    if(db.fired.includes(key))continue;
    db.fired.push(key);db.fired=db.fired.slice(-60);save();
    toast(s.rem?`${T.name} через ${s.rem} хв`:T.name,'#run-'+T.id);
  }
}

/* run engine */
const IC={play:'M8 5.5v13l10.5-6.5z',pause:'M7 5.5h3v13H7zM14 5.5h3v13h-3z',replay:'M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z'};
const WAVES='M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.5 7.5 0 0 1 0 10.4',MUTE='M16 9.5l5 5M21 9.5l-5 5';
let RT=null,segs=[],total=0,EV=[],lineEls=[],run=false,acc=0,t0=0,cur=-1,raf=0,wl=null,goK='';
let ac=null,master=null,nodes=[],muted=!!db.muted;
const cache={};
const set=(id,v)=>{if(cache[id]!==v){cache[id]=v;$(id).textContent=v}};
function audio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination)}catch(e){ac=null}}
  if(ac&&ac.state!=='running'){try{ac.resume()}catch(e){}}
}
function tone(at,f,d,v){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(f,at);
  g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(v,at+.01);
  g.gain.setValueAtTime(v,at+d*.5);g.gain.exponentialRampToValueAtTime(.0001,at+d);
  o.connect(g);g.connect(master);o.start(at);o.stop(at+d+.05);nodes.push(o);
}
const SFX={
  tick:at=>tone(at,1047,.12,.5),
  work:at=>{tone(at,784,.14,.55);tone(at+.15,1175,.5,.55)},
  rest:at=>{tone(at,1175,.14,.5);tone(at+.15,784,.5,.5)},
  done:at=>[659,784,988,1319].forEach((f,i)=>tone(at+i*.16,f,i===3?1:.18,.45))
};
function cancel(){nodes.forEach(o=>{try{o.disconnect()}catch(e){}try{o.stop()}catch(e){}});nodes=[]}
function schedule(E){
  cancel();if(!ac)return;
  const base=ac.currentTime+.05;
  for(const e of EV)if(e.t>=E-.02)SFX[e.k](base+(e.t-E));
}
function drawSnd(){
  $('sndw').setAttribute('d',muted?MUTE:WAVES);$('snd').setAttribute('aria-pressed',String(!muted));
  $('snd').setAttribute('aria-label',muted?'Увімкнути звук':'Вимкнути звук');
  if(master)master.gain.value=muted?0:1;
}
function goIcon(k){if(goK===k)return;goK=k;$('gop').setAttribute('d',IC[k]);$('go').setAttribute('aria-label',{play:'Старт',pause:'Пауза',replay:'Ще раз'}[k])}
function setDig(v){set('dig',v);$('dig').classList.toggle('sm',v.length>3)}
async function wake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){wl=null}}
function unwake(){try{if(wl)wl.release()}catch(e){}wl=null}
const el=()=>Math.min(total,acc+(run?(performance.now()-t0)/1000:0));
const idx=E=>{let i=0;while(i<segs.length-1&&E>=segs[i].s+segs[i].d)i++;return i};
const runTheme=p=>{if(view==='run')theme(PHC[p])};
function metaOf(i){
  const g=segs[i],n=segs[i+1],R=RT.rounds;
  if(g.p==='work')return `Підхід ${g.k} з ${g.n}`+(R>1?` · коло ${g.c} з ${R}`:'');
  if(!n||n.p!=='work')return '';
  if(g.p!=='prep'&&n.c!==g.c)return `Далі коло ${n.c} з ${R}`;
  if(g.p!=='prep'&&n.b!==g.b)return `Далі блок ${n.b}`;
  return `Далі підхід ${n.k} з ${n.n}`;
}
function render(){
  if(!RT)return;
  const E=el(),vr=$('v-run');
  if(E>=total&&(run||acc>=total)){
    if(run){run=false;acc=total;unwake()}
    if(cur!==-2){cur=-2;vr.dataset.p='done';runTheme('done');lineEls.forEach(x=>{x.firstChild.style.width='100%'})}
    set('phase','Готово');setDig(fmt(total));set('meta',summary(RT));set('el',fmt(total));set('left','−0:00');goIcon('replay');
    return;
  }
  const i=idx(E),g=segs[i],p=Math.min(1,(E-g.s)/g.d);
  if(i!==cur){
    if(run&&cur>=0){try{navigator.vibrate&&navigator.vibrate(g.p==='work'?[160,80,160]:220)}catch(e){}}
    cur=i;vr.dataset.p=g.p;runTheme(g.p);
    lineEls.forEach((x,j)=>{x.firstChild.style.width=j<i?'100%':'0'});
  }
  const idle=!run&&acc===0;
  set('phase',idle||run?NAME[g.p]:'Пауза');
  set('meta',idle?summary(RT):metaOf(i));
  const r=Math.ceil(g.s+g.d-E-1e-6);setDig(r<100?String(r):fmt(r));
  lineEls[i].firstChild.style.width=(p*100)+'%';
  set('el',fmt(E));set('left','−'+fmt(Math.ceil(total-E-1e-6)));
  goIcon(run?'pause':'play');
}
function loop(){render();if(run)raf=requestAnimationFrame(loop)}
function start(){
  audio();
  if(el()>=total){acc=0;cur=-1}
  t0=performance.now();run=true;schedule(acc);wake();
  cancelAnimationFrame(raf);loop();
}
function pause(){acc=el();run=false;cancel();unwake();cancelAnimationFrame(raf);render()}
function stopRun(){run=false;cancel();unwake();cancelAnimationFrame(raf)}
function seek(E){
  if(run)t0=performance.now();
  acc=Math.max(0,Math.min(E,total));cur=-1;
  if(run)schedule(acc);
  render();
}
function openRun(id){
  stopRun();RT=getT(id);({segs,total}=build(RT));
  EV=[];
  segs.forEach((g,i)=>{if(i>0||g.p==='work')EV.push({t:g.s,k:g.p==='work'?'work':'rest'});for(let n=1;n<=3;n++)if(g.d>n)EV.push({t:g.s+g.d-n,k:'tick'})});
  EV.push({t:total,k:'done'});
  $('line').innerHTML=segs.map(g=>`<div class="${g.p==='work'?'w':''}" style="flex-grow:${g.d}"><i></i></div>`).join('');
  lineEls=[...$('line').children];
  acc=0;cur=-1;set('rname',RT.name);render();
}
$('go').addEventListener('click',()=>{if(run)pause();else start()});
$('skip').addEventListener('click',()=>{const E=el();if(E>=total)return;const g=segs[idx(E)];seek(g.s+g.d)});
$('back').addEventListener('click',()=>{
  const E=el();if(E>=total){seek(segs[segs.length-1].s);return}
  const i=idx(E);seek(E-segs[i].s>1.5||i===0?segs[i].s:segs[i-1].s);
});
$('snd').addEventListener('click',()=>{muted=!muted;db.muted=muted;save();audio();drawSnd()});
$('rx').addEventListener('click',()=>{location.hash=''});
document.addEventListener('keydown',e=>{
  if(view!=='run')return;
  if(e.code==='Space'&&!(e.target.closest&&e.target.closest('button'))){e.preventDefault();$('go').click()}
  else if(e.key==='ArrowRight')$('skip').click();
  else if(e.key==='ArrowLeft')$('back').click();
  else if(e.key==='Escape')location.hash='';
});

/* router */
let view='';
function show(v){
  view=v;
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  if(v==='run')theme(PHC[$('v-run').dataset.p]||PHC.prep);
  else if(v==='edit'&&draft)theme(draft.color);
  else theme(BG());
}
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(view==='run'&&h!=='run-'+(RT&&RT.id))stopRun();
  if(h==='plan'){renderPlan();show('plan')}
  else if(h==='new'){openEditor(null);show('edit')}
  else if(h.startsWith('edit-')&&getT(h.slice(5))){openEditor(h.slice(5));show('edit')}
  else if(h.startsWith('run-')&&getT(h.slice(4))){openRun(h.slice(4));show('run')}
  else{sEdit=null;renderHome();show('home')}
  scrollTo(0,0);
}
addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  due();
  if(run){wake();audio();schedule(el());render()}
  else if(view==='home')renderHome();
});
setInterval(()=>{if(run)render()},250);
setInterval(()=>{due();if(view==='home'&&!run)renderHome()},30000);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
drawSnd();goIcon('play');route();due();
}
</script>
